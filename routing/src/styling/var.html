<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일 변수</title>
    <style>
        /* :root에서 먼저 정의 한 다음에 */
        :root{
            /* 배경색 */
            --green-color: #3da557;

            /* 바깥 여백 */
            --my-2: 0.5rem;
            --my-3: 1rem;
        }
        div {
            width: 100px;
            height: 100px;
            /* var함수로 적용 */
            background-color: var(--green-color);
            margin: var(--my-3);
            /* 수평: inline -> 속성 적용 시 inline-block 사용 */
            display: inline-block; /* 수평 배치 */
        }
    </style>
</head>
<body>
    <h2>스타일 변수</h2>
    <div></div>
    <div></div>
</body>
</html>
